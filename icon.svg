<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#141424" />
    </linearGradient>

    <!-- Aura Glow Gradient -->
    <radialGradient id="aura-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Equals Button / Logo Gradient -->
    <linearGradient id="equals-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Aura Blur Filter -->
    <filter id="aura-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <!-- Base App Icon Masked Container (squircle shape for iOS/Android home screens) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg-grad)" />

  <!-- Glowing Background Orbs (Aura Effect) -->
  <circle cx="200" cy="180" r="160" fill="url(#aura-grad)" filter="url(#aura-blur)" />
  <circle cx="340" cy="320" r="140" fill="radialGradient(cx=50%, cy=50%, r=50%)" fill-opacity="0.3" filter="url(#aura-blur)">
    <animate attributeName="cx" values="340;300;340" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Glassmorphic Card Overlay -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#glass-grad)" stroke="url(#border-grad)" stroke-width="3" />

  <!-- Calculator Grid Subtle Dots -->
  <circle cx="160" cy="160" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="224" cy="160" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="288" cy="160" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="352" cy="160" r="6" fill="#ffffff" opacity="0.15" />
  
  <circle cx="160" cy="224" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="224" cy="224" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="288" cy="224" r="6" fill="#ffffff" opacity="0.15" />
  
  <circle cx="160" cy="288" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="224" cy="288" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="288" cy="288" r="6" fill="#ffffff" opacity="0.15" />
  
  <circle cx="160" cy="352" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="224" cy="352" r="6" fill="#ffffff" opacity="0.15" />
  <circle cx="288" cy="352" r="6" fill="#ffffff" opacity="0.15" />

  <!-- Sleek Glowing Equal Symbol in Keypad Operator Spot -->
  <g filter="url(#glow)">
    <rect x="156" y="228" width="200" height="24" rx="12" fill="url(#equals-grad)" />
    <rect x="156" y="276" width="200" height="24" rx="12" fill="url(#equals-grad)" />
  </g>

  <!-- Mini Accent brand dot -->
  <circle cx="352" cy="116" r="10" fill="url(#equals-grad)" filter="url(#glow)" />
</svg>
